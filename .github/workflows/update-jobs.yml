name: Update early-career jobs

on:
  schedule:
    - cron: "17 * * * *" # hourly; off the top of the hour to reduce GitHub scheduling congestion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan public job sources
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRIES: us,gb,ca
        run: python scripts/scan_jobs.py

      - name: Commit updated job data
        run: |
          git config user.name "early-career-bot"
          git config user.email "41898282舫憹actions[bot]@users.noreply.github.com"
          git add data/opportunities.json
          git diff --cached --quiet || git commit -m "Update job opportunities"
          git push

